<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#d6b691">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="小貓的窩">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>小貓的窩</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <filter id="rough" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="3" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G"/></filter>
  <filter id="rough-s" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.09" numOctaves="1" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.4" xChannelSelector="R" yChannelSelector="G"/></filter>
</svg>
<div class="app">
  <div class="stage" id="stage">
    <canvas id="nest" aria-label="小貓的窩，可以撫摸、抱起、餵食和逗貓"></canvas>
    <div class="hud" id="hud">
      <header class="topbar">
        <button class="who paper" id="whoBtn" aria-label="打開手帳">
          <canvas id="avatar" width="96" height="96" aria-hidden="true"></canvas>
          <span class="whotxt"><b id="catName">小貓的窩</b><span id="stageChip">還沒有小貓</span></span>
        </button>
        <div class="clock paper" id="clock">第 1 天 08:00</div>
        <button class="ibtn paper" id="bookBtn" aria-label="手帳"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/><path d="M9 8h6"/></svg>手帳</button>
        <button class="ibtn paper" id="menuBtn" aria-label="選單"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 7h14M5 12h14M5 17h14"/></svg>選單</button>
      </header>
      <div class="needs paper" id="needs"></div>
      <div class="caption paper" id="caption" hidden></div>
      <div class="banner" id="banner" hidden></div>
      <div class="toasts" id="toasts"></div>
      <nav class="tools paper" id="tools" aria-label="工具"></nav>
      <div class="moments" id="moments" hidden></div>
      <div class="overlay" id="overlay" hidden></div>
    </div>
  </div>
</div>

<div class="scrim" id="scrim" hidden></div>
<aside class="book" id="book" hidden aria-label="手帳">
  <div class="grab" aria-hidden="true"></div>
  <div class="bookhd"><h2>手帳</h2><button class="btn" id="bookClose">收起</button></div>
  <div class="tabs" role="tablist">
    <button role="tab" data-tab="grow" aria-selected="true">成長</button>
    <button role="tab" data-tab="traits" aria-selected="false">性格</button>
    <button role="tab" data-tab="mem" aria-selected="false">記憶</button>
    <button role="tab" data-tab="log" aria-selected="false">手記</button>
    <button role="tab" data-tab="dev" aria-selected="false" id="devTab" hidden>開發</button>
  </div>
  <div class="bookbody">
    <section class="tabp" data-p="grow">
      <div class="ph"><h3>成長</h3><span class="sub" id="ageTxt"></span></div>
      <div class="lifebar" id="lifebar"></div>
      <div class="sub" id="growEta"></div>
      <ul class="tasks" id="tasks"></ul>
      <div id="growNotes" style="display:grid;gap:6px"></div>
    </section>
    <section class="tabp" data-p="traits" hidden>
      <div class="ph"><h3>性格</h3><span class="sub">天生的，只能慢慢發現</span></div>
      <div class="note" id="firstImp"></div>
      <div class="traits" id="traits"></div>
    </section>
    <section class="tabp" data-p="mem" hidden>
      <div class="ph"><h3>牠記得的事</h3><span class="sub">會慢慢淡掉</span></div>
      <ul class="mems" id="mems"></ul>
    </section>
    <section class="tabp" data-p="log" hidden>
      <div class="ph"><h3>生活手記</h3></div>
      <ul class="log" id="log"></ul>
    </section>
    <section class="tabp" data-p="dev" hidden>
      <div class="ph"><h3>開發者視角</h3><span class="sub">只有網址帶 ?dev=1 才看得到</span></div>
      <div class="devbtns"><button class="btn" id="growBtn">直接長到下一階段</button><button class="btn" id="dDoor">惹毛牠（觸發關門）</button><button class="btn" id="dBug">放一隻小蟲</button><button class="btn" id="dHungry">讓牠餓一整天</button><button class="btn" id="dNew">重新領養</button><button class="btn" id="dNext" hidden></button></div>
      <h4>心情與需求</h4><div class="bars" id="devBars"></div>
      <h4>行為決策（之後由 AI 接手的那一層）</h4><div class="scores" id="devScores"></div><div class="sub" id="devBeh"></div>
      <h4>天生性格參數</h4><div id="devSliders" style="display:grid;gap:6px"></div>
    </section>
  </div>
</aside>

<div class="menu paper" id="menu" hidden>
  <div class="row"><h3>時間流速</h3><span class="sub">原型測試用，正式版會改成真實時間</span>
    <div class="seg" role="group" aria-label="時間流速">
      <button data-sp="1" aria-pressed="false">1 秒 = 1 分</button>
      <button data-sp="10" aria-pressed="true">1 秒 = 10 分</button>
      <button data-sp="60" aria-pressed="false">1 秒 = 1 小時</button>
    </div></div>
  <div class="row"><button class="btn" id="ffBtn">離開 3 小時</button><button class="btn" id="helpBtn">怎麼玩</button></div>
</div>

<div class="guide" id="guide" hidden role="dialog" aria-modal="true" aria-labelledby="gTitle"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
